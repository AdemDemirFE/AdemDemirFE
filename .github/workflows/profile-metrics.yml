name: Update GitHub Profile Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: AdemDemirFE
        run: python scripts/update_profile_metrics.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update profile metrics"
          git push
