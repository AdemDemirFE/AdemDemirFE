<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-label="Adem Demir — Senior Software Development Specialist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <rect x="0" y="204" width="1200" height="6" fill="url(#accent)"/>
  <text x="50%" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#f8fafc" letter-spacing="6">ADEM DEMIR</text>
  <text x="50%" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#06b6d4" letter-spacing="3">SENIOR SOFTWARE DEVELOPMENT SPECIALIST</text>
  <text x="50%" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#94a3b8">Full Stack · Mobile · Cloud · AI · Architecture · Security</text>
  <rect x="600" y="170" width="0" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="0;320;320;0" keyTimes="0;0.35;0.65;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="600;440;440;600" keyTimes="0;0.35;0.65;1" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
